name: Fast quality

on:
  workflow_call:
    inputs:
      code_ref:
        description: Exact adapter-source revision to check; empty uses the caller revision.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    name: Fast quality
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rptadv-samplerate-adapter-ci:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rptadv-samplerate-adapter
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Check formatting, lint, and static analysis
        run: make -j3 lint static-analysis
