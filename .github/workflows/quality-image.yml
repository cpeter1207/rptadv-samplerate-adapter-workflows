name: Publish adapter quality image

on:
  workflow_call:
    inputs:
      code_ref:
        description: Immutable adapter-source revision containing the quality-image recipe.
        required: true
        type: string
      image_tag:
        description: GHCR tag for the published multi-architecture image.
        required: false
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      code_ref:
        description: Immutable adapter-source revision containing the quality-image recipe.
        required: true
        type: string
        default: main
      image_tag:
        description: GHCR tag for the published multi-architecture image.
        required: true
        type: string
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  native-image:
    name: Build native ${{ matrix.arch }} quality image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rptadv-samplerate-adapter
          ref: ${{ inputs.code_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/quality.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/cpeter1207/rptadv-samplerate-adapter-quality:${{ inputs.image_tag }}-${{ matrix.arch }}

  manifest:
    name: Publish multi-architecture quality image
    needs: native-image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create native-image manifest
        env:
          IMAGE: ghcr.io/cpeter1207/rptadv-samplerate-adapter-quality
          TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
      - name: Make quality container public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --method PATCH /user/packages/container/rptadv-samplerate-adapter-quality \
            -f visibility=public >/dev/null; then
            echo "::error::GitHub did not allow this workflow to make the adapter quality container public." >&2
            exit 1
          fi
